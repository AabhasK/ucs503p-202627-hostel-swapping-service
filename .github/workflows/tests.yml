name: tests

on:
  push:
    branches:
      - master
      - main
      - develop
      - development
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10; prove it on every supported version.
        python-version: ["3.10", "3.11", "3.12"]

    # A throwaway database for tests/test_db_live.py; the rest of the
    # suite never touches a database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e "./code[dev]"

      - name: Migrate the test database
        run: python db/migrate.py
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run tests
        run: pytest -q
